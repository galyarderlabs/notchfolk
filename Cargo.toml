[workspace]
resolver = "3"
members = [
    "crates/notchfolk-core",
    "crates/notchfolk-daemon",
    "crates/notchfolk-shelf",
    "crates/notchfolk-whisper",
]
# notchfolk-shelf needs the GTK 4 development files, and notchfolk-whisper cmake, a C++
# compiler, libclang and (for the GPU) the Vulkan headers and glslc, so they
# are only built when asked for: `cargo build -p notchfolk-shelf -p notchfolk-whisper`.
default-members = ["crates/notchfolk-core", "crates/notchfolk-daemon"]

[workspace.package]
version = "1.4.0"
edition = "2024"
# notchfolk-core and notchfolkd use let chains (1.88); notchfolk-shelf sets its own, for gtk-rs.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/galyarderlabs/notchfolk"
description = "Notchfolk: A living notch-style desktop island and AI companion for GNOME Shell with MCP and local voice support"
keywords = ["gnome", "desktop-island", "dynamic-island", "ai-assistant", "mcp"]
categories = ["command-line-utilities", "multimedia", "accessibility"]
# Released as programs, not on crates.io.
publish = false

[workspace.dependencies]
notchfolk-core = { path = "crates/notchfolk-core" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
# Plain log lines: the journal adds the time, and filters are simple module names.
env_logger = { version = "0.11", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_12"] }
# Phone sharing's tiny HTTP server reads request heads with it; nothing else of a web stack.
httparse = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
inotify = { version = "0.11", default-features = false, features = ["stream"] }
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }
libc = "0.2"
log = "0.4"
# Names the shelf's previews as the extension does (the URI's MD5); no security rides on it.
md5 = "0.8"
# Phone sharing's QR code, as modules only: the extension draws them.
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Compares phone sharing's secret token in constant time.
subtle = "2"
# Edits Codex's config.toml in place, keeping its comments and layout.
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
# No gzip: the few small JSON answers are not worth a deflate implementation.
ureq = { version = "3", default-features = false, features = ["rustls", "json", "multipart"] }
# The USB devices on the bus, read from udev's database and monitor (libudev).
udev = "0.9"
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The service and the shelf are small and mostly wait: built for size. notchfolk-whisper keeps
# full speed for transcribing.
[profile.release.package.notchfolk-daemon]
opt-level = "s"

[profile.release.package.notchfolk-core]
opt-level = "s"

[profile.release.package.notchfolk-shelf]
opt-level = "s"

# Their libraries too (zbus, tokio, image, ureq...): less code for notchfolkd to hold in memory. Not
# whisper's, which keep full speed.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.whisper-rs]
opt-level = 3

[profile.release.package.whisper-rs-sys]
opt-level = 3
